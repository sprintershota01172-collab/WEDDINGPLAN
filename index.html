                </div>

                <div class="pack-input-wrapper" style="background:var(--bg-surface); border-radius:var(--radius-md); margin-bottom:16px; box-shadow:var(--shadow-sm); border:0.5px solid var(--border-light);">
                    <input type="text" id="newPackInput" class="pack-input" placeholder="持ち物を追加..." list="history-items" autocomplete="off" onkeypress="if(event.key==='Enter') addPackItem()">
                    <select id="newPackSchedId" class="pack-input" style="flex:0.5; min-width:85px; padding: 0 10px; font-weight:600;">
                        <option value="">(共通)</option>
                        ${scheds.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                    </select>
                    <button class="pack-add-btn" onclick="addPackItem()">追加</button>
                </div>
            `;

            Object.keys(groupedItems).forEach(key => {
                const group = groupedItems[key];
                if (key !== 'common' && group.items.length === 0) return; 
                if (key === 'common' && group.items.length === 0 && Object.keys(groupedItems).length > 1) return; 

                html += `<div class="pack-group"><div class="pack-group-header">${group.sched.name}</div>`;
                if (group.items.length === 0) { html += `<div style="padding:12px 16px; font-size:12px; font-weight:600; color:var(--text-muted);">登録されていません</div>`; } 
                else {
                    group.items.sort((a,b) => (a.isChecked === b.isChecked)? 0 : a.isChecked ? 1 : -1).forEach(item => {
                        html += `
                            <div class="pack-item ${item.isChecked ? 'checked' : ''}" onclick="togglePackItem('${item.id}')">
                                <div style="width:20px; height:20px; border-radius:50%; border:1.5px solid var(--text-muted); display:flex; align-items:center; justify-content:center; background:${item.isChecked ? 'var(--status-ok)' : 'transparent'}; border-color:${item.isChecked ? 'var(--status-ok)' : 'var(--text-muted)'}; transition:all 0.2s var(--ease-ios);">
                                    ${item.isChecked ? '<span style="color:white; font-weight:bold; font-size:11px;">✓</span>' : ''}
                                </div>
                                <div class="pack-name">${item.name}</div>
                                <button class="pack-del" onclick="event.stopPropagation(); deletePackItem('${item.id}')">×</button>
                            </div>`;
                    });
                }
                html += `</div>`;
            });
            packContent.innerHTML = html;
        }

        function addPackItem() {
            const input = document.getElementById('newPackInput'); const schedSelect = document.getElementById('newPackSchedId'); const name = input.value.trim();
            if(!name || !currentProjId) return;
            tripItems.push({ id: 'item_' + Date.now().toString() + Math.random().toString(36).substr(2, 5), projectId: currentProjId, schedId: schedSelect.value || null, name: name, isChecked: false });
            saveHistory('items', name); saveTrips(); renderPackView();
            input.value = ''; 
        }

        function togglePackItem(id) { const item = tripItems.find(i => i.id === id); if(item) { item.isChecked = !item.isChecked; saveTrips(); renderPackView(); } }
        function deletePackItem(id) { tripItems = tripItems.filter(i => i.id !== id); saveTrips(); renderPackView(); }

        function exportExcel() {
            if(!currentProjId) return alert('プロジェクトを選択してください');
            const proj = tripProjs.find(p => p.id === currentProjId); const scheds = tripScheds.filter(s => s.projectId === currentProjId);
            if(scheds.length === 0) return alert('出力する行程データが存在しません');
            scheds.sort((a,b) => { 
                const aD = a.startDate || a.date; const bD = b.startDate || b.date;
                if(aD !== bD) return aD.localeCompare(bD); 
                return a.start.localeCompare(b.start); 
            });
            let csv = '\uFEFF'; csv += '出張名,開始日,終了日,開始時刻,終了時刻,行程内容,座席,宿泊先\n';
            scheds.forEach(s => { csv += `"${proj.title}","${(s.startDate||s.date).replace(/-/g,'/')}","${(s.endDate||s.date).replace(/-/g,'/')}","${s.start}","${s.end}","${s.name}","${s.seat||''}","${s.hotel||''}"\n`; });
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `${proj.title}_行程表.csv`; a.click();
        }

        // =========================================
        // モーダル保存処理群
        // =========================================
        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('t-id').value; const name = document.getElementById('t-name').value;
            const category = document.querySelector('input[name="t-cat"]:checked').value;
            const data = { 
                name: name, category: category,
                deadline: document.getElementById('t-dead').value, 
                priority: parseInt(document.getElementById('t-pri').value), 
                hours: parseFloat(document.getElementById('t-hours').value) 
            };
            if (id) { const idx = tasks.findIndex(t => t.id === id); if (idx > -1) tasks[idx] = { ...tasks[idx], ...data }; } 
            else { data.id = Date.now().toString(); data.createdAt = formatYMD(new Date()); tasks.push(data); }
            saveHistory('tasks', name); saveTasks(); closeModal('taskModal'); refresh();
        };

        document.getElementById('projForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value; const name = document.getElementById('p-name').value;
            const data = { title: name, start: rcStart || formatYMD(new Date()), end: rcEnd || formatYMD(new Date()) };
            if (id) { const idx = tripProjs.findIndex(t => t.id === id); if (idx > -1) tripProjs[idx] = { ...tripProjs[idx], ...data }; } 
            else { data.id = 'proj_' + Date.now().toString(); tripProjs.push(data); currentProjId = data.id; currentTripDate = data.start; }
            saveHistory('projs', name); saveTrips(); closeModal('projModal'); refresh();
        };

        document.getElementById('schedForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('s-id').value; const name = document.getElementById('s-name').value;
            const pId = window.isGeneralPlan ? 'GENERAL' : (currentProjId || 'GENERAL');
            
            let sD = document.getElementById('s-start-date').value;
            let eD = document.getElementById('s-end-date').value;
            if (sD > eD) eD = sD;
            
            const data = { 
                projectId: pId, name: name, 
                date: sD, 
                startDate: sD,
                endDate: eD,
                start: document.getElementById('s-start').value, 
                end: document.getElementById('s-end').value,
                seat: document.getElementById('s-seat').value,
                hotel: document.getElementById('s-hotel').value
            };
            if (id) { const idx = tripScheds.findIndex(t => t.id === id); if (idx > -1) tripScheds[idx] = { ...tripScheds[idx], ...data }; } 
            else { data.id = 'sch_' + Date.now().toString(); tripScheds.push(data); }
            
            const itemsStr = document.getElementById('s-items').value;
            if (itemsStr && itemsStr.trim() !== '') {
                itemsStr.split(',').map(s => s.trim()).filter(s => s !== '').forEach(itemName => {
                    tripItems.push({ id: 'item_' + Date.now().toString() + Math.random().toString(36).substr(2, 5), projectId: pId, schedId: data.id, name: itemName, isChecked: false });
                    saveHistory('items', itemName);
                });
            }
            saveHistory('scheds', name); saveTrips(); 
            window.isGeneralPlan = false; closeModal('schedModal'); refresh();
        };

        // =========================================
        // モーダル開閉・削除呼出
        // =========================================
        function openTaskModal(id = null) {
            document.getElementById('taskForm').reset(); const delBtn = document.getElementById('btnDeleteTask');
            if(id){ 
                const t=tasks.find(x=>x.id===id); 
                document.getElementById('taskModalTitle').textContent='タスクの編集'; 
                document.getElementById('t-id').value=t.id; document.getElementById('t-name').value=t.name; 
                document.getElementById('t-dead').value=t.deadline; document.getElementById('t-pri').value=t.priority; document.getElementById('t-hours').value=t.hours;
                delBtn.style.display='block'; 
            } else { 
                document.getElementById('taskModalTitle').textContent='新規タスクの登録'; 
                document.getElementById('t-id').value=''; document.getElementById('t-dead').value=window.selectedDashDate || formatYMD(new Date()); document.getElementById('t-pri').value='2'; 
                delBtn.style.display='none'; 
            }
            document.getElementById('taskModal').classList.add('active');
        }
        function deleteTask() { 
            showConfirm('タスクの削除', 'このタスクを削除しますか？', '削 除', 'var(--status-err)', () => {
                tasks = tasks.filter(t => t.id !== document.getElementById('t-id').value); saveTasks(); closeModal('taskModal'); refresh(); 
            });
        }

        function openProjModal(id = null) {
            document.getElementById('projForm').reset(); const delBtn = document.getElementById('btnDeleteProj');
            if (id) {
                const p = tripProjs.find(x => x.id === id); document.getElementById('projModalTitle').textContent = 'プロジェクトの編集'; document.getElementById('p-id').value = p.id; document.getElementById('p-name').value = p.title;
                rcStart = p.start; rcEnd = p.end; rcCurrentDate = new Date(p.start);
                delBtn.style.display = 'block';
            } else {
                document.getElementById('projModalTitle').textContent = '新規出張の登録'; document.getElementById('p-id').value = ''; 
                rcStart = null; rcEnd = null; rcCurrentDate = new Date();
                delBtn.style.display = 'none';
            }
            renderRangeCalendar();
            document.getElementById('projModal').classList.add('active');
        }
        function deleteProj() {
            showConfirm('出張の削除', 'プロジェクトと関連する全データ<br>（行程・持物）を削除しますか？', '削 除', 'var(--status-err)', () => {
                const id = document.getElementById('p-id').value; tripProjs = tripProjs.filter(p => p.id !== id); 
                tripScheds = tripScheds.filter(s => s.projectId !== id); tripItems = tripItems.filter(i => i.projectId !== id);
                if(currentProjId === id) { currentProjId = null; currentTripDate = null; }
                saveTrips(); closeModal('projModal'); refresh();
            });
        }

        function openSchedModal(id = null) {
            document.getElementById('schedForm').reset(); const delBtn = document.getElementById('btnDeleteSched');
            document.getElementById('s-items').value = ''; 
            if (id) {
                const s = tripScheds.find(x => x.id === id); 
                window.isGeneralPlan = (s.projectId === 'GENERAL');
                document.getElementById('schedModalTitle').textContent = window.isGeneralPlan ? '予定の編集' : '行程の編集'; 
                document.getElementById('s-id').value = s.id; document.getElementById('s-name').value = s.name; 
                document.getElementById('s-start-date').value = s.startDate || s.date; document.getElementById('s-end-date').value = s.endDate || s.date; 
                document.getElementById('s-start').value = s.start; document.getElementById('s-end').value = s.end; 
                document.getElementById('s-seat').value = s.seat || ''; document.getElementById('s-hotel').value = s.hotel || '';
                delBtn.style.display = 'block';
            } else {
                window.isGeneralPlan = false;
                document.getElementById('schedModalTitle').textContent = '行程の追加'; document.getElementById('s-id').value = ''; 
                const targetD = currentTripDate || window.selectedDashDate || formatYMD(new Date());
                document.getElementById('s-start-date').value = targetD; document.getElementById('s-end-date').value = targetD; 
                document.getElementById('s-seat').value = ''; document.getElementById('s-hotel').value = '';
                delBtn.style.display = 'none';
            }
            document.getElementById('schedModal').classList.add('active');
        }
        function deleteSched() { 
            showConfirm('予定の削除', '対象のデータを削除しますか？', '削 除', 'var(--status-err)', () => {
                tripScheds = tripScheds.filter(s => s.id !== document.getElementById('s-id').value); saveTrips(); closeModal('schedModal'); refresh(); 
            });
        }

        // =========================================
        // クイック追加 (スマート自動振り分け)
        // =========================================
        function handleSmartAdd() {
            const inputEl = document.getElementById('quickAddInput');
            let text = inputEl.value.trim();
            
            if (!text) {
                openTaskModalWithDate(window.selectedDashDate);
                return;
            }

            let isPlan = false;
            let startTime = '09:00';
            let endTime = '10:00';
            
            const timeMatch = text.match(/([0-9]{1,2})[:：]([0-9]{2})|([0-9]{1,2})時(?:([0-9]{1,2})分)?/);
            
            if (timeMatch) {
                isPlan = true;
                let h = 9, m = 0;
                
                if (timeMatch[1]) { 
                    h = parseInt(timeMatch[1], 10);
                    m = parseInt(timeMatch[2], 10);
                } else if (timeMatch[3]) { 
                    h = parseInt(timeMatch[3], 10);
                    m = timeMatch[4] ? parseInt(timeMatch[4], 10) : 0;
                }
                
                startTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                
                let endH = h + 1;
                let endM = m;
                if (endH >= 24) { endH = 23; endM = 59; }
                endTime = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
            }
            
            if (isPlan) {
                let cleanName = text.replace(timeMatch[0], '').trim();
                if (!cleanName) cleanName = '予定'; 

                const data = { 
                    id: 'sch_' + Date.now().toString(),
                    projectId: 'GENERAL', 
                    name: cleanName, 
                    date: window.selectedDashDate, 
                    startDate: window.selectedDashDate,
                    endDate: window.selectedDashDate,
                    start: startTime, 
                    end: endTime,
                    seat: '',
                    hotel: ''
                };
                tripScheds.push(data);
                saveHistory('scheds', cleanName); 
                saveTrips(); 
            } else {
                const data = { 
                    id: Date.now().toString(),
                    createdAt: formatYMD(new Date()),
                    name: text, 
                    category: 'business', 
                    deadline: window.selectedDashDate, 
                    priority: 2, 
                    hours: 1.0 
                };
                tasks.push(data);
                saveHistory('tasks', text); 
                saveTasks(); 
            }
            
            inputEl.value = ''; 
            inputEl.blur();     
            refresh();
        }

        // =========================================
        // スワイプ操作による編集・削除UI制御
        // =========================================
        let swStartX = 0; let swStartY = 0; let swCurrentX = 0; 
        let swEl = null; let swOpenedEl = null; const SW_WIDTH = 100; 
        window.isSwipingAction = false; 

        function swStart(e) {
            if (swOpenedEl && swOpenedEl !== e.currentTarget) swClose(swOpenedEl);
            swStartX = e.touches[0].clientX; 
            swStartY = e.touches[0].clientY; 
            swCurrentX = swStartX;
            swEl = e.currentTarget; 
            swEl.classList.add('swiping'); 
            swEl.isScrolling = undefined;
        }

        function swMove(e) {
            if (!swEl) return;
            swCurrentX = e.touches[0].clientX;
            const diffX = swCurrentX - swStartX; 
            const diffY = e.touches[0].clientY - swStartY;
            
            if (typeof swEl.isScrolling === 'undefined') {
                swEl.isScrolling = Math.abs(diffY) > Math.abs(diffX);
            }
            if (swEl.isScrolling) return; 

            let moveX = diffX;
            if (swEl.dataset.opened === 'true') moveX -= SW_WIDTH;
            
            if (moveX > 0) moveX = 0; 
            if (moveX < -SW_WIDTH - 20) moveX = -SW_WIDTH - 20; 
            
            swEl.style.transform = `translateX(${moveX}px)`;
        }

        function swEnd(e) {
            if (!swEl) return;
            swEl.classList.remove('swiping');
            if (swEl.isScrolling) { swEl = null; return; }
            
            let diff = swCurrentX - swStartX;
            if (Math.abs(diff) < 5 && swEl.dataset.opened !== 'true') { swEl = null; return; }
            
            if (swEl.dataset.opened === 'true') diff -= SW_WIDTH;
            
            if (diff < -30) {
                swEl.style.transform = `translateX(-${SW_WIDTH}px)`;
                swEl.dataset.opened = 'true'; 
                swOpenedEl = swEl;
            } else {
                swClose(swEl);
            }
            
            if(Math.abs(swCurrentX - swStartX) > 10) {
                window.isSwipingAction = true;
                setTimeout(() => window.isSwipingAction = false, 50);
            }
            swEl = null;
        }

        function swClose(el) {
            el.style.transform = `translateX(0px)`;
            el.dataset.opened = 'false';
            if (swOpenedEl === el) swOpenedEl = null;
        }

        document.addEventListener('touchstart', (e) => {
            if (swOpenedEl && !e.target.closest('.swipe-container')) {
                swClose(swOpenedEl);
            }
        });

        function deleteFromSwipe(type, id) {
            if (swOpenedEl) swClose(swOpenedEl); 
            
            showConfirm(type === 'sched' ? '予定の削除' : 'タスクの削除', 'このデータを削除しますか？', '削 除', 'var(--status-err)', () => {
                if (type === 'sched') { 
                    tripScheds = tripScheds.filter(s => s.id !== id); 
                    saveTrips(); 
                } else { 
                    tasks = tasks.filter(t => t.id !== id); 
                    saveTasks(); 
                }
                refresh();
            });
        }

        load(); refresh();
    </script>
</body>
</html>
